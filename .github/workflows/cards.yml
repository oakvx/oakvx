name: Generate card SVGs
on:
  push:
    paths:
      - "assets/cards/cards.json"
      - "tools/gen_cards.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate card SVGs from cards.json
        run: python3 tools/gen_cards.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: regenerate card SVGs from cards.json"
            git push
          else
            echo "SVGs already up to date."
          fi
