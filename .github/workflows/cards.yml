name: Generate card SVGs
on:
  push:
    paths:
      - "assets/cards/cards.json"
      - "tools/gen_cards.py"
      - "tools/render_card_pngs.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate card SVGs from cards.json
        run: python3 tools/gen_cards.py

      - name: Install resvg-py
        run: pip install resvg-py

      - name: Render any missing card PNGs
        # Brand-new cards get their PNG rendered here (system fonts stand in
        # for the brand font). Existing PNGs are never overwritten - those are
        # committed brand-font rasterizations.
        run: python3 tools/render_card_pngs.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/cards/*.svg assets/*.png assets/cards/cards.json tools/
            git commit -m "chore: regenerate card SVGs/PNGs from cards.json"
            git push
          else
            echo "SVGs/PNGs already up to date."
          fi
