name: Update recent activity
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "users/oakvx/repos?sort=pushed&per_page=6" \
            --jq '.[] | select(.name != "oakvx") | "- [`\(.name)`](\(.html_url)) · updated \(.pushed_at[:10])"' > recent.md
      - name: Inject into README
        run: |
          python3 - <<'EOF'
          import re
          readme = open("README.md", encoding="utf-8").read()
          block = open("recent.md", encoding="utf-8").read().strip()
          new = re.sub(r"(<!-- RECENT:START -->).*?(<!-- RECENT:END -->)",
                       lambda m: f"{m.group(1)}\n{block}\n{m.group(2)}",
                       readme, flags=re.S)
          open("README.md", "w", encoding="utf-8").write(new)
          EOF
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git commit -am "chore: update recent activity" && git push)
