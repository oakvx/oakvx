  <text x="58" y="132" class="title">Synk</text>
  <text x="58" y="169" class="description">A chat assistant that books salon</text>
<text x="58" y="193" class="description">appointments.</text>
  <rect x="58" y="216" width="80" height="31" rx="15.5" fill="#fbfcfc" stroke="#d8dfe1"/>
      <text x="98" y="236" class="tag" text-anchor="middle">Node.js</text><rect x="148" y="216" width="139" height="31" rx="15.5" fill="#fbfcfc" stroke="#d8dfe1"/>
      <text x="217.5" y="236" class="tag" text-anchor="middle">Google Calendar</text>
  <rect x="474" y="59" width="152" height="152" rx="28" fill="none" stroke="#16c2e3" stroke-width="9" opacity=".48" filter="url(#glow)"/>
  <g filter="url(#tileShadow)"><rect x="475" y="60" width="150" height="150" rx="27" fill="#fbfcfc" stroke="#16bad8" stroke-width="4"/></g>
  <rect x="481" y="66" width="138" height="138" rx="22" fill="none" stroke="#c2edf3"/>
  <circle cx="550" cy="135" r="50" fill="#f7f9f9" stroke="#e3e9ea"/>
  <circle cx="550" cy="135" r="44" fill="none" stroke="#edf1f1"/>
  <g transform="translate(550 135)"><g fill="none" stroke="#08a8c9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
