      <path d="M-1 10h36M9-7v10M25-7v10"/>
      <path d="M9 19h5m7 0h4M9 25h5" stroke-width="2.3"/>
    </g></g>
  <circle cx="566" cy="232" r="11" fill="#f8fbfb" stroke="#c5d5d8"/>
