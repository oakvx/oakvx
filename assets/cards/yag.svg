<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8fafa"/><stop offset="1" stop-color="#f0f4f4"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafa"/></linearGradient>
    <pattern id="dots" width="34" height="28" patternUnits="userSpaceOnUse"><circle cx="10" cy="12" r="0.75" fill="#d8e0e1" fill-opacity="0.52"/></pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#8da3a9" flood-opacity="0.24"/></filter>
    <filter id="tileShadow" x="-35%" y="-35%" width="170%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#68848c" flood-opacity="0.22"/></filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      text { font-family: 'Inter', sans-serif; }
      .number { font-size: 13px; font-weight: 600; fill: #7a8589; letter-spacing: .1px; }
      .title { font-family: 'Continuum Bold', 'Inter', sans-serif; font-size: 40px; font-weight: 400; fill: #3e4447; letter-spacing: -.55px; }
      .description { font-size: 16px; font-weight: 400; fill: #6d787c; letter-spacing: -.12px; }
      .tag { font-size: 12px; font-weight: 500; fill: #626e72; }
      .open { font-size: 13px; font-weight: 400; fill: #7b868a; }
      .key { font-size: 10px; font-weight: 600; fill: #20a9c4; }
    </style>
  </defs>
  <rect width="680" height="300" fill="url(#bg)"/>
  <rect width="680" height="300" fill="url(#dots)"/>
  <rect x="24" y="22" width="632" height="254" rx="25" fill="url(#card)" stroke="#dce3e4" filter="url(#shadow)"/>
  <text x="58" y="66" class="number">09</text>
  <text x="58" y="132" class="title">YAG</text>
  <text x="58" y="169" class="description">An experimental C17 AI gateway:</text>
<text x="58" y="193" class="description">multi-backend routing, protocol translations.</text>
  <rect x="58" y="216" width="55" height="31" rx="15.5" fill="#fbfcfc" stroke="#d8dfe1"/>
      <text x="85" y="236" class="tag" text-anchor="middle">C17</text><rect x="123" y="216" width="77" height="31" rx="15.5" fill="#fbfcfc" stroke="#d8dfe1"/>
      <text x="161" y="236" class="tag" text-anchor="middle">OpenAI</text><rect x="210" y="216" width="98" height="31" rx="15.5" fill="#fbfcfc" stroke="#d8dfe1"/>
      <text x="259" y="236" class="tag" text-anchor="middle">Anthropic</text>
  <rect x="474" y="59" width="152" height="152" rx="28" fill="none" stroke="#16c2e3" stroke-width="9" opacity=".48" filter="url(#glow)"/>
  <g filter="url(#tileShadow)"><rect x="475" y="60" width="150" height="150" rx="27" fill="#fbfcfc" stroke="#16bad8" stroke-width="4"/></g>
  <rect x="481" y="66" width="138" height="138" rx="22" fill="none" stroke="#c2edf3"/>
  <circle cx="550" cy="135" r="50" fill="#f7f9f9" stroke="#e3e9ea"/>
  <circle cx="550" cy="135" r="44" fill="none" stroke="#edf1f1"/>
  <g transform="translate(550 135)"><g fill="none" stroke="#6366f1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <line x1="0" y1="0" x2="-37" y2="-40"/>
      <line x1="0" y1="0" x2="37" y2="-33"/>
      <line x1="0" y1="0" x2="33" y2="37"/>
      <rect x="-46" y="-49" width="18" height="18" rx="4" fill="#6366f1" fill-opacity="0.07" stroke="#6366f1" stroke-width="2.6"/>
      <circle cx="-37" cy="-40" r="2.6" fill="#6366f1" stroke="none"/>
      <rect x="28" y="-42" width="18" height="18" rx="4" fill="#6366f1" fill-opacity="0.07" stroke="#6366f1" stroke-width="2.6"/>
      <circle cx="37" cy="-33" r="2.6" fill="#6366f1" stroke="none"/>
      <rect x="24" y="28" width="18" height="18" rx="4" fill="#6366f1" fill-opacity="0.07" stroke="#6366f1" stroke-width="2.6"/>
      <circle cx="33" cy="37" r="2.6" fill="#6366f1" stroke="none"/>
      <rect x="-21" y="-21" width="42" height="42" rx="8" fill="#6366f1" fill-opacity="0.07" stroke="#6366f1" stroke-width="2.6"/>
      <rect x="-8" y="-8" width="16" height="16" rx="3"/>
    </g></g>
  <circle cx="566" cy="232" r="11" fill="#f8fbfb" stroke="#c5d5d8"/>
  <text x="566" y="236" class="key" text-anchor="middle">A</text>
  <text x="587" y="238" class="open">Open</text>
</svg>