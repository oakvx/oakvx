      <text x="90" y="236" class="tag" text-anchor="middle">HTML</text><rect x="132" y="216" width="56" height="31" rx="15.5" fill="#fbfcfc" stroke="#d8dfe1"/>
      <text x="160" y="236" class="tag" text-anchor="middle">CSS</text><rect x="198" y="216" width="46" height="31" rx="15.5" fill="#fbfcfc" stroke="#d8dfe1"/>
      <text x="221" y="236" class="tag" text-anchor="middle">JS</text>
  <rect x="474" y="59" width="152" height="152" rx="28" fill="none" stroke="#16c2e3" stroke-width="9" opacity=".48" filter="url(#glow)"/>
  <g filter="url(#tileShadow)"><rect x="475" y="60" width="150" height="150" rx="27" fill="#fbfcfc" stroke="#16bad8" stroke-width="4"/></g>
  <rect x="481" y="66" width="138" height="138" rx="22" fill="none" stroke="#c2edf3"/>
  <circle cx="550" cy="135" r="50" fill="#f7f9f9" stroke="#e3e9ea"/>
  <circle cx="550" cy="135" r="44" fill="none" stroke="#edf1f1"/>
  <g transform="translate(550 135)"><g fill="none" stroke="#22a884" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
